<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="血压记录"><meta name="theme-color" content="#355c7d"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>体重·血压记录</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Arial,sans-serif;color:#17202a;background:#f4f6f8}body{margin:0;padding:16px;max-width:760px;margin:auto}h1{font-size:25px;margin:8px 0}.sub,.hint{color:#667085}.sub{margin-bottom:14px}.card{background:#fff;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 1px 5px #0001}.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.tab{background:#e9eef4;color:#263747}.tab.active{background:#355c7d;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}label{font-size:13px;color:#475467;display:block;margin-bottom:5px}input,select,textarea,button{box-sizing:border-box;width:100%;font-size:17px;border-radius:10px;border:1px solid #d0d5dd;padding:11px;background:white}textarea{min-height:62px}button{border:0;background:#355c7d;color:white;font-weight:700;margin-top:8px}.secondary{background:#e9eef4;color:#263747}.danger{background:#fff0f0;color:#a11}.row{display:flex;gap:8px}.row>*{flex:1}.big{font-size:20px;font-weight:700}.stat{font-size:14px;line-height:1.8}.entry{padding:10px 0;border-bottom:1px solid #eee;font-size:14px}.entryhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.entryactions{display:flex;gap:6px;flex:0 0 auto}.entryactions button{width:auto;margin:0;padding:6px 9px;font-size:13px}.editnote{display:none;margin-top:8px;padding:8px;border-radius:9px;background:#fff7e6;color:#7a4b00}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef3f8;margin:4px 4px 0 0}.ok{display:none;margin-top:10px;padding:9px;border-radius:9px;background:#eef8f0}.hidden{display:none}.hint{font-size:12px}.warn{font-size:12px;color:#8a5a00}.range{display:flex;gap:7px;margin:10px 0}.range button{margin:0;padding:8px;font-size:14px;background:#e9eef4;color:#263747}.range button.active{background:#355c7d;color:#fff}.chartbox{width:100%;height:250px;margin-top:8px}.chartbox canvas{width:100%;height:100%;display:block}.legend{font-size:12px;color:#667085;margin-top:6px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:currentColor;margin-right:4px}@media(max-width:520px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body>
<h1>体重 · 血压记录</h1><div class="sub">V5 Beta 5：恢复备份改为安全合并，避免旧设备备份覆盖较新的本机记录；并保留体重变化速度等 V5 改进。数据保存在此浏览器本机。</div>
<div class="card"><div class="tabs"><button id="tMorning" class="tab active" onclick="setMode('morning')">☀️ 7 AM</button><button id="tMed" class="tab" onclick="setMode('medicine')">💊 8 PM</button><button id="tNight" class="tab" onclick="setMode('night')">🌙 10 PM</button></div></div>
<div class="card"><div class="grid">
<div><label>日期</label><input id="date" type="date"></div><div><label>时间</label><input id="time" type="time"></div>
<div id="weightBox"><label>体重 (<span id="weightUnitLabel">lb</span>)</label><input id="weight" type="number" step="0.1" inputmode="decimal" placeholder="190.0"></div><div id="weightUnitBox"><label>体重单位</label><select id="weightUnit" onchange="setWeightUnit(this.value)"><option value="lb">lb</option><option value="jin">斤</option><option value="kg">kg</option></select></div>
<div id="medTakenBox" class="hidden"><label>是否服药</label><select id="medTaken"><option value="yes">已服药</option><option value="no">未服药</option></select></div>
<div id="medNameBox" class="hidden full"><label>用药方案</label><select id="medPreset" onchange="applyMedPreset()"><option value="fixed">Losartan potassium 25 mg; Amlodipine Besylate 10 mg; Atorvastatin 10 mg</option><option value="custom">其他 / 手动输入</option></select><div id="customMedBox" class="hidden" style="margin-top:8px"><input id="medName" placeholder="药名"><input id="dose" style="margin-top:6px" placeholder="剂量"></div></div><div id="doseBox" class="hidden"></div>
<div id="sysBox"><label>收缩压</label><input id="sys" type="number" inputmode="numeric" placeholder="例如 144"></div><div id="diaBox"><label>舒张压</label><input id="dia" type="number" inputmode="numeric" placeholder="例如 94"></div>
<div id="hrBox"><label>心率 (bpm)</label><input id="hr" type="number" inputmode="numeric" placeholder="例如 77"></div><div id="symptomBox"><label>感觉</label><select id="symptom"><option>无</option><option>头晕</option><option>困倦</option><option>头晕＋困倦</option><option>其他</option></select></div>
<div class="full"><label>备注</label><textarea id="note" placeholder="运动、咖啡、饮酒、盐分、睡眠或其他情况"></textarea></div></div>
<button id="saveBtn" onclick="saveEntry()">保存这次记录</button><button id="cancelEditBtn" class="secondary hidden" onclick="cancelEdit()">取消修改</button><div id="editnote" class="editnote">正在修改已有记录</div><div id="saved" class="ok">✓ 已保存</div><div class="hint" style="margin-top:8px">服药请按开药者的处方执行；这个记录器不用于决定是否自行停药或改剂量。</div></div>
<div class="card"><div class="big" id="statsTitle">7天平均</div><div id="stats" class="stat">暂无数据</div></div>
<div class="card"><div class="big">趋势 📈</div><div class="range"><button id="r7" class="active" onclick="setRange(7)">7天</button><button id="r30" onclick="setRange(30)">30天</button><button id="rAll" onclick="setRange(0)">全部</button></div><div class="range"><button id="scaleAuto" class="active" onclick="setScale('auto')">自动比例</button><button id="scaleStandard" onclick="setScale('standard')">标准比例</button></div><div class="hint">自动比例会放大细微变化；标准比例保持较宽纵轴，便于避免视觉夸大。横轴按实际测量日期/时间显示；💊表示服药记录。</div><div class="chartbox"><canvas id="weightChart"></canvas></div><div class="legend" id="weightLegend">体重 · 目标参考 170 lb</div><div class="chartbox"><canvas id="bpChart"></canvas></div><div class="legend">血压 (mmHg)：收缩压 / 舒张压；同一天多次测量会按实际时间展开。</div></div>
<div class="card"><div class="big">App</div><button class="secondary" onclick="shareApp()">分享此 App</button><div class="hint" style="margin-top:7px">只分享程序网址，不分享任何体重、血压、用药或备注数据。</div></div><div class="card"><div class="big">最近记录</div><div id="entries"></div><div class="row"><button class="secondary" onclick="shareCSV()">导出 / 分享 CSV</button><button class="secondary" onclick="backupJSON()">备份</button></div><div class="row"><button class="secondary" onclick="restoreJSON()">恢复备份</button><button class="danger" onclick="clearAll()">清空全部</button></div><input id="restoreFile" type="file" accept="application/json,.json" class="hidden"></div>
<script>
const $=id=>document.getElementById(id), KEY='bo_bp_tracker_v3', UNITKEY='bo_bp_weight_unit'; let mode='morning', chartRange=7, chartScale='auto', editingId=null, weightUnit=localStorage.getItem(UNITKEY)||'lb'; if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
function localDate(){let d=new Date(),o=d.getTimezoneOffset();return new Date(d-o*60000).toISOString().slice(0,10)}
$('date').value=localDate();
const unitFactor={lb:1,jin:2,kg:0.45359237}; const unitName={lb:'lb',jin:'斤',kg:'kg'};
function lbToDisplay(v){return v==null?null:v*unitFactor[weightUnit]} function displayToLb(v){return v==null?null:v/unitFactor[weightUnit]} function fmtWeight(v){let n=lbToDisplay(v);return n==null?'—':n.toFixed(1)}
function setWeightUnit(u){let old=weightUnit, raw=parseFloat($('weight').value);if(Number.isFinite(raw)){let lb=raw/unitFactor[old];$('weight').value=(lb*unitFactor[u]).toFixed(1)}weightUnit=u;localStorage.setItem(UNITKEY,u);$('weightUnitLabel').textContent=unitName[u];$('weightUnit').value=u;render()}
$('weightUnit').value=weightUnit;$('weightUnitLabel').textContent=unitName[weightUnit];
function setMode(m){mode=m;['Morning','Med','Night'].forEach(x=>$('t'+x).classList.remove('active'));$(m==='morning'?'tMorning':m==='medicine'?'tMed':'tNight').classList.add('active');let med=m==='medicine', bp=!med;$('weightBox').classList.toggle('hidden',m==='medicine');$('weightUnitBox').classList.toggle('hidden',m==='medicine');$('medTakenBox').classList.toggle('hidden',!med);$('medNameBox').classList.toggle('hidden',!med);$('doseBox').classList.toggle('hidden',!med);['sysBox','diaBox','hrBox','symptomBox'].forEach(id=>$(id).classList.toggle('hidden',!bp));$('time').value=m==='morning'?'07:00':m==='medicine'?'20:00':'22:00'}
setMode('morning');
function data(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function put(d){localStorage.setItem(KEY,JSON.stringify(d))}
function entryFromForm(){return {id:editingId||Date.now(),type:mode,date:$('date').value,time:$('time').value,weight:(+$('weight').value?displayToLb(+$('weight').value):null),medTaken:$('medTaken').value,medPreset:$('medPreset').value,medName:$('medName').value.trim(),dose:$('dose').value.trim(),sys:+$('sys').value||null,dia:+$('dia').value||null,hr:+$('hr').value||null,symptom:$('symptom').value,note:$('note').value.trim()}}
function saveEntry(){let e=entryFromForm();if(!e.date||!e.time){alert('请填写日期和时间。');return}if(mode!=='medicine'&&(!e.sys||!e.dia)){alert('请填写收缩压和舒张压。');return}if(mode==='medicine'&&e.medTaken==='yes'&&e.medPreset==='custom'&&!e.medName){alert('请填写药名。');return}let d=data();if(editingId){let i=d.findIndex(x=>x.id===editingId);if(i>=0)d[i]=e;else d.push(e)}else d.push(e);d.sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));try{put(d)}catch(err){alert('当前打开方式不允许本机保存。请用 Safari 中的正式网页/PWA 版本。');return}$('saved').textContent=editingId?'✓ 修改已保存':'✓ 已保存';$('saved').style.display='block';setTimeout(()=>$('saved').style.display='none',1800);cancelEdit(true);$('sys').value=$('dia').value=$('hr').value='';$('note').value='';render()}
function editEntry(id){let e=data().find(x=>x.id===id);if(!e)return;editingId=id;setMode(e.type);$('date').value=e.date;$('time').value=e.time;$('weight').value=e.weight!=null?fmtWeight(e.weight):'';$('medTaken').value=e.medTaken||'yes';$('medPreset').value=e.medPreset||'custom';$('medName').value=e.medName||'';$('dose').value=e.dose||'';applyMedPreset();$('sys').value=e.sys??'';$('dia').value=e.dia??'';$('hr').value=e.hr??'';$('symptom').value=e.symptom||'无';$('note').value=e.note||'';$('saveBtn').textContent='保存修改';$('cancelEditBtn').classList.remove('hidden');$('editnote').style.display='block';window.scrollTo({top:0,behavior:'smooth'})}
function cancelEdit(keepMode=false){editingId=null;$('saveBtn').textContent='保存这次记录';$('cancelEditBtn').classList.add('hidden');$('editnote').style.display='none';if(!keepMode)setMode(mode)}
function deleteEntry(id){let e=data().find(x=>x.id===id);if(!e)return;if(confirm(`确定删除 ${e.date} ${e.time} 的这条记录吗？`)){put(data().filter(x=>x.id!==id));if(editingId===id)cancelEdit();render()}}
function applyMedPreset(){let custom=$('medPreset').value==='custom';$('customMedBox').classList.toggle('hidden',!custom)}
function medText(e){return e.medPreset==='fixed'?'Losartan potassium 25 mg; Amlodipine Besylate 10 mg; Atorvastatin 10 mg':`${esc(e.medName)} ${esc(e.dose)}`.trim()}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function avg(a,k,d=0){let v=a.map(x=>x[k]).filter(x=>Number.isFinite(x));return v.length?(v.reduce((p,c)=>p+c,0)/v.length).toFixed(d):'—'}
function periodLabel(e){if(e.type==='medicine')return '服药';let h=+(e.time||'00:00').slice(0,2);if(h<12)return '早晨';if(h>=20)return '睡前';return '其他时段'}
function render(){let d=data();$('entries').innerHTML=d.length?d.slice(0,30).map(e=>{let name=periodLabel(e);let main=e.type==='medicine'?(e.medTaken==='yes'?`已服 ${medText(e)}`:'未服药'):`<b>${e.sys}/${e.dia}</b>${e.hr?` · HR ${e.hr}`:''}${e.weight?` · ${fmtWeight(e.weight)} ${unitName[weightUnit]}`:''}`;return `<div class="entry"><div class="entryhead"><div><b>${e.date} ${e.time} · ${name}</b></div><div class="entryactions"><button class="secondary" onclick="editEntry(${e.id})">编辑</button><button class="danger" onclick="deleteEntry(${e.id})">删除</button></div></div>${main}<br>${e.symptom&&e.type!=='medicine'?`<span class="pill">${esc(e.symptom)}</span>`:''}${e.note?`<span class="pill">${esc(e.note)}</span>`:''}</div>`}).join(''):'暂无记录';let r=rangeEntries(d),m=r.filter(x=>x.type!=='medicine'&&+(x.time||'00:00').slice(0,2)<12&&x.sys),n=r.filter(x=>x.type!=='medicine'&&+(x.time||'00:00').slice(0,2)>=20&&x.sys);function weightRate(a){let pts=a.filter(x=>Number.isFinite(x.weight)).map(x=>({t:new Date(x.date+'T'+(x.time||'00:00')+':00').getTime()/86400000,y:lbToDisplay(x.weight)}));if(pts.length<2)return null;let mt=pts.reduce((s,p)=>s+p.t,0)/pts.length,my=pts.reduce((s,p)=>s+p.y,0)/pts.length,num=pts.reduce((s,p)=>s+(p.t-mt)*(p.y-my),0),den=pts.reduce((s,p)=>s+(p.t-mt)*(p.t-mt),0);if(!den)return null;return num/den}let rate=weightRate(r),perDay=chartRange===7,rateVal=rate==null?'—':Math.abs(rate*(perDay?1:7)).toFixed(2),rateWord=rate==null?'':rate<0?'下降':rate>0?'上升':'持平';$('statsTitle').textContent=chartRange===7?'7天平均':chartRange===30?'30天平均':'全部记录平均';$('stats').innerHTML=r.length?`早晨平均：<b>${avg(m,'sys')}/${avg(m,'dia')}</b> mmHg　HR ${avg(m,'hr')}<br>睡前平均：<b>${avg(n,'sys')}/${avg(n,'dia')}</b> mmHg　HR ${avg(n,'hr')}<br>体重趋势：<b>${rate==null?'数据不足':rateWord+' '+rateVal+' '+unitName[weightUnit]+'/'+(perDay?'天':'周')}</b><br><span class="hint">血压按当前${chartRange===7?'7天':chartRange===30?'30天':'全部'}范围计算；体重变化速度根据该范围内全部体重记录的线性趋势估算。</span>`:'暂无数据';drawCharts()}

function setRange(n){chartRange=n;['r7','r30','rAll'].forEach(id=>$(id).classList.remove('active'));$(n===7?'r7':n===30?'r30':'rAll').classList.add('active');render()}
function rangeEntries(d){if(!chartRange)return d;let end=new Date(localDate()+'T23:59:59'),start=new Date(end);start.setDate(start.getDate()-chartRange+1);return d.filter(e=>new Date(e.date+'T'+(e.time||'00:00')+':00')>=start)}
function setScale(s){chartScale=s;$('scaleAuto').classList.toggle('active',s==='auto');$('scaleStandard').classList.toggle('active',s==='standard');drawCharts()}
function chartEntries(){let d=data().filter(e=>e.type!=='medicine'&&e.sys).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));if(chartRange){let end=new Date(localDate()+'T23:59:59'),start=new Date(end);start.setDate(start.getDate()-chartRange+1);d=d.filter(e=>new Date(e.date+'T'+e.time+':00')>=start)}return d}
function setupCanvas(c){let rect=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=Math.max(300,rect.width*dpr);c.height=Math.max(180,rect.height*dpr);let x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);return {x,w:rect.width,h:rect.height}}
function lineChart(id,points,series,standardRange,target){let c=$(id),{x,w,h}=setupCanvas(c);x.clearRect(0,0,w,h);let pad={l:46,r:12,t:16,b:34},pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;if(!points.length){x.fillStyle='#667085';x.font='14px -apple-system';x.fillText('暂无数据',pad.l,40);return}let vals=series.flatMap(s=>s.vals.filter(Number.isFinite));if(!vals.length)return;let lo,hi;if(chartScale==='standard'){[lo,hi]=standardRange}else{let min=Math.min(...vals),max=Math.max(...vals),span=Math.max(max-min,1),margin=Math.max(3,span*.35);lo=Math.floor((min-margin)/5)*5;hi=Math.ceil((max+margin)/5)*5;if(target!=null&&target>=lo-5&&target<=hi+5){lo=Math.min(lo,target-5);hi=Math.max(hi,target+5)}if(hi-lo<10){let mid=(hi+lo)/2;lo=Math.floor((mid-5)/5)*5;hi=Math.ceil((mid+5)/5)*5}}let times=points.map(p=>new Date(p.date+'T'+p.time+':00').getTime()),t0=Math.min(...times),t1=Math.max(...times);if(t1===t0){t0-=3600000;t1+=3600000}let X=i=>pad.l+(times[i]-t0)*pw/(t1-t0),Y=v=>pad.t+(hi-v)*ph/(hi-lo);x.strokeStyle='#d9e0e6';x.lineWidth=1;x.fillStyle='#667085';x.font='11px -apple-system';for(let j=0;j<=4;j++){let v=lo+(hi-lo)*j/4,y=Y(v);x.beginPath();x.moveTo(pad.l,y);x.lineTo(w-pad.r,y);x.stroke();x.fillText(Math.round(v),4,y+4)}if(target!=null&&target>=lo&&target<=hi){x.setLineDash([5,4]);x.strokeStyle='#98a2b3';x.beginPath();x.moveTo(pad.l,Y(target));x.lineTo(w-pad.r,Y(target));x.stroke();x.setLineDash([])}series.forEach((s,si)=>{x.strokeStyle=['#355c7d','#9a6700','#7b61a8','#3d7f5f'][si%4];x.lineWidth=1.8;x.beginPath();let started=false;s.vals.forEach((v,i)=>{if(!Number.isFinite(v)){started=false;return}let xx=X(i),yy=Y(v);if(!started){x.moveTo(xx,yy);started=true}else x.lineTo(xx,yy);x.fillStyle=x.strokeStyle;x.fillRect(xx-2,yy-2,4,4)});x.stroke()});let step=Math.max(1,Math.ceil(points.length/4));x.fillStyle='#667085';x.font='10px -apple-system';points.forEach((p,i)=>{if(i%step===0||i===points.length-1){let lab=points.length<=6?p.time:p.date.slice(5).replace('-','/');x.fillText(lab,X(i)-14,h-9)}})}
function drawCharts(){let p=chartEntries(),wp=p.filter(e=>Number.isFinite(e.weight));let w=wp.map(e=>lbToDisplay(e.weight)),sys=p.map(e=>e.sys??null),dia=p.map(e=>e.dia??null);let target=lbToDisplay(170),std=weightUnit==='lb'?[160,200]:weightUnit==='jin'?[320,400]:[72,91];$('weightLegend').textContent=`体重 (${unitName[weightUnit]}) · 目标参考 ${target.toFixed(1)} ${unitName[weightUnit]}`;lineChart('weightChart',wp,[{vals:w}],std,target);lineChart('bpChart',p,[{vals:sys},{vals:dia}],[50,180],null)}
window.addEventListener('resize',()=>drawCharts());

async function shareApp(){let url=location.href.split('#')[0].split('?')[0];try{if(navigator.share){await navigator.share({title:'体重·血压记录',text:'体重·血压记录 App',url});return}}catch(e){if(e.name==='AbortError')return}try{await navigator.clipboard.writeText(url);alert('App 网址已复制。')}catch(e){prompt('请复制 App 网址：',url)}}
function csvText(){let d=data(),h=['日期','时间','类型','体重lb','是否服药','药名','剂量','收缩压','舒张压','心率','症状','备注'],q=v=>'"'+String(v??'').replaceAll('"','""')+'"';return '\ufeff'+h.join(',')+'\n'+d.map(e=>[e.date,e.time,e.type,e.weight,e.type==='medicine'?(e.medTaken==='yes'?'是':'否'):'',e.type==='medicine'&&e.medPreset==='fixed'?'Losartan potassium 25 mg; Amlodipine Besylate 10 mg; Atorvastatin 10 mg':e.medName,e.dose,e.sys,e.dia,e.hr,e.symptom,e.note].map(q).join(',')).join('\n')}
async function shareCSV(){if(!data().length){alert('还没有记录');return}let blob=new Blob([csvText()],{type:'text/csv;charset=utf-8'}),file=new File([blob],'体重血压记录.csv',{type:'text/csv'});try{if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'体重血压记录'});return}}catch(e){if(e.name==='AbortError')return}let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
async function backupJSON(){let blob=new Blob([JSON.stringify(data(),null,2)],{type:'application/json'}),file=new File([blob],`BP-Tracker-Backup-${new Date().toISOString().slice(0,10)}-${new Date().toTimeString().slice(0,5).replace(':','')}.json`,{type:'application/json'});try{if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'血压记录备份'});return}}catch(e){if(e.name==='AbortError')return}let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restoreJSON(){$('restoreFile').click()}
function recordKey(x){return [x.type||'',x.date||'',x.time||''].join('|')}
function sameRecord(a,b){let clean=x=>JSON.stringify({type:x.type||'',date:x.date||'',time:x.time||'',weight:x.weight??null,medTaken:x.medTaken||'',medPreset:x.medPreset||'',medName:x.medName||'',dose:x.dose||'',sys:x.sys??null,dia:x.dia??null,hr:x.hr??null,symptom:x.symptom||'',note:x.note||''});return clean(a)===clean(b)}
function mergeBackup(local,backup){let merged=local.slice(),byKey=new Map();merged.forEach((x,i)=>{let k=recordKey(x);if(!byKey.has(k))byKey.set(k,[]);byKey.get(k).push(i)});let added=0,duplicates=0,conflicts=[];for(let b of backup){let k=recordKey(b),idxs=byKey.get(k)||[],same=idxs.find(i=>sameRecord(merged[i],b));if(same!==undefined){duplicates++;continue}if(idxs.length){conflicts.push({backup:b,local:merged[idxs[0]]});continue}let copy={...b};if(copy.id==null||merged.some(x=>x.id===copy.id))copy.id=Date.now()+added+Math.floor(Math.random()*1000);merged.push(copy);let ni=merged.length-1;byKey.set(k,[ni]);added++}merged.sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));return {merged,added,duplicates,conflicts}}
$('restoreFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let b=JSON.parse(await f.text());if(!Array.isArray(b))throw 0;let local=data(),r=mergeBackup(local,b),msg=`准备合并备份\n\n本机：${local.length} 条\n备份：${b.length} 条\n新增：${r.added} 条\n重复：${r.duplicates} 条\n冲突：${r.conflicts.length} 条\n\n合并后：${r.merged.length} 条\n不会删除本机现有记录。`;if(r.conflicts.length){msg+=`\n\n发现 ${r.conflicts.length} 条同一日期和时间但内容不同的记录。为安全起见，这些冲突记录暂不自动导入；本机记录会保留。`};if(confirm(msg+'\n\n确认合并？')){put(r.merged);render();alert(`合并完成：新增 ${r.added} 条；保留本机记录；${r.conflicts.length?'有 '+r.conflicts.length+' 条冲突未自动导入。':'没有冲突。'}`)}}catch{alert('备份文件格式不正确。')}e.target.value=''};
function clearAll(){if(confirm('确定清空所有记录吗？请先备份。')){localStorage.removeItem(KEY);render()}}
render();
</script></body></html>
