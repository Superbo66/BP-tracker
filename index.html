<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="血压记录"><meta name="theme-color" content="#355c7d"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>体重·血压记录</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Arial,sans-serif;color:#17202a;background:#f4f6f8}body{margin:0;padding:16px;max-width:760px;margin:auto}h1{font-size:25px;margin:8px 0}.sub,.hint{color:#667085}.sub{margin-bottom:14px}.card{background:#fff;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 1px 5px #0001}.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.tab{background:#e9eef4;color:#263747}.tab.active{background:#355c7d;color:white}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}label{font-size:13px;color:#475467;display:block;margin-bottom:5px}input,select,textarea,button{box-sizing:border-box;width:100%;font-size:17px;border-radius:10px;border:1px solid #d0d5dd;padding:11px;background:white}textarea{min-height:62px}button{border:0;background:#355c7d;color:white;font-weight:700;margin-top:8px}.secondary{background:#e9eef4;color:#263747}.danger{background:#fff0f0;color:#a11}.row{display:flex;gap:8px}.row>*{flex:1}.big{font-size:20px;font-weight:700}.stat{font-size:14px;line-height:1.8}.entry{padding:10px 0;border-bottom:1px solid #eee;font-size:14px}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef3f8;margin:4px 4px 0 0}.ok{display:none;margin-top:10px;padding:9px;border-radius:9px;background:#eef8f0}.hidden{display:none}.hint{font-size:12px}.warn{font-size:12px;color:#8a5a00}.range{display:flex;gap:7px;margin:10px 0}.range button{margin:0;padding:8px;font-size:14px;background:#e9eef4;color:#263747}.range button.active{background:#355c7d;color:#fff}.chartbox{width:100%;height:250px;margin-top:8px}.chartbox canvas{width:100%;height:100%;display:block}.legend{font-size:12px;color:#667085;margin-top:6px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:currentColor;margin-right:4px}@media(max-width:520px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body>
<h1>体重 · 血压记录</h1><div class="sub">V3：早晨测量 → 晚间服药 → 睡前测量。记录保存在此浏览器本机。</div>
<div class="card"><div class="tabs"><button id="tMorning" class="tab active" onclick="setMode('morning')">☀️ 7 AM</button><button id="tMed" class="tab" onclick="setMode('medicine')">💊 8 PM</button><button id="tNight" class="tab" onclick="setMode('night')">🌙 10 PM</button></div></div>
<div class="card"><div class="grid">
<div><label>日期</label><input id="date" type="date"></div><div><label>时间</label><input id="time" type="time"></div>
<div id="weightBox"><label>体重 (lb)</label><input id="weight" type="number" step="0.1" inputmode="decimal" placeholder="190.0"></div>
<div id="medTakenBox" class="hidden"><label>是否服药</label><select id="medTaken"><option value="yes">已服药</option><option value="no">未服药</option></select></div>
<div id="medNameBox" class="hidden"><label>药名</label><input id="medName" placeholder="例如 Losartan"></div><div id="doseBox" class="hidden"><label>剂量</label><input id="dose" placeholder="例如 50 mg"></div>
<div id="sysBox"><label>收缩压</label><input id="sys" type="number" inputmode="numeric" placeholder="例如 144"></div><div id="diaBox"><label>舒张压</label><input id="dia" type="number" inputmode="numeric" placeholder="例如 94"></div>
<div id="hrBox"><label>心率 (bpm)</label><input id="hr" type="number" inputmode="numeric" placeholder="例如 77"></div><div id="symptomBox"><label>感觉</label><select id="symptom"><option>无</option><option>头晕</option><option>困倦</option><option>头晕＋困倦</option><option>其他</option></select></div>
<div class="full"><label>备注</label><textarea id="note" placeholder="运动、咖啡、饮酒、盐分、睡眠或其他情况"></textarea></div></div>
<button onclick="saveEntry()">保存这次记录</button><div id="saved" class="ok">✓ 已保存</div><div class="hint" style="margin-top:8px">服药请按开药者的处方执行；这个记录器不用于决定是否自行停药或改剂量。</div></div>
<div class="card"><div class="big">最近 7 天</div><div id="stats" class="stat">暂无数据</div></div>
<div class="card"><div class="big">趋势 📈</div><div class="range"><button id="r7" class="active" onclick="setRange(7)">7天</button><button id="r30" onclick="setRange(30)">30天</button><button id="rAll" onclick="setRange(0)">全部</button></div><div class="hint">体重显示每日值；血压分别显示早晨与睡前。虚线表示7天移动平均；💊表示当天有服药记录。</div><div class="chartbox"><canvas id="weightChart"></canvas></div><div class="legend">体重 (lb) · 目标参考 170 lb</div><div class="chartbox"><canvas id="bpChart"></canvas></div><div class="legend">血压 (mmHg)：早晨收缩/舒张、睡前收缩/舒张</div></div>
<div class="card"><div class="big">最近记录</div><div id="entries"></div><div class="row"><button class="secondary" onclick="shareCSV()">导出 / 分享 CSV</button><button class="secondary" onclick="backupJSON()">备份</button></div><div class="row"><button class="secondary" onclick="restoreJSON()">恢复备份</button><button class="danger" onclick="clearAll()">清空全部</button></div><input id="restoreFile" type="file" accept="application/json,.json" class="hidden"></div>
<script>
const $=id=>document.getElementById(id), KEY='bo_bp_tracker_v3'; let mode='morning', chartRange=7; if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
function localDate(){let d=new Date(),o=d.getTimezoneOffset();return new Date(d-o*60000).toISOString().slice(0,10)}
$('date').value=localDate();
function setMode(m){mode=m;['Morning','Med','Night'].forEach(x=>$('t'+x).classList.remove('active'));$(m==='morning'?'tMorning':m==='medicine'?'tMed':'tNight').classList.add('active');let med=m==='medicine', bp=!med;$('weightBox').classList.toggle('hidden',m!=='morning');$('medTakenBox').classList.toggle('hidden',!med);$('medNameBox').classList.toggle('hidden',!med);$('doseBox').classList.toggle('hidden',!med);['sysBox','diaBox','hrBox','symptomBox'].forEach(id=>$(id).classList.toggle('hidden',!bp));$('time').value=m==='morning'?'07:00':m==='medicine'?'20:00':'22:00'}
setMode('morning');
function data(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function put(d){localStorage.setItem(KEY,JSON.stringify(d))}
function saveEntry(){let e={id:Date.now(),type:mode,date:$('date').value,time:$('time').value,weight:+$('weight').value||null,medTaken:$('medTaken').value,medName:$('medName').value.trim(),dose:$('dose').value.trim(),sys:+$('sys').value||null,dia:+$('dia').value||null,hr:+$('hr').value||null,symptom:$('symptom').value,note:$('note').value.trim()};if(!e.date||!e.time){alert('请填写日期和时间。');return}if(mode!=='medicine'&&(!e.sys||!e.dia)){alert('请填写收缩压和舒张压。');return}if(mode==='medicine'&&e.medTaken==='yes'&&!e.medName){alert('请填写药名。');return}let d=data();d.push(e);d.sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));try{put(d)}catch(err){alert('当前打开方式不允许本机保存。请用 Safari 中的正式网页/PWA 版本。');return}$('saved').style.display='block';setTimeout(()=>$('saved').style.display='none',1800);$('sys').value=$('dia').value=$('hr').value='';$('note').value='';render()}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function avg(a,k,d=0){let v=a.map(x=>x[k]).filter(x=>Number.isFinite(x));return v.length?(v.reduce((p,c)=>p+c,0)/v.length).toFixed(d):'—'}
function render(){let d=data();$('entries').innerHTML=d.length?d.slice(0,30).map(e=>{let name=e.type==='morning'?'早晨':e.type==='medicine'?'服药':'睡前';let main=e.type==='medicine'?(e.medTaken==='yes'?`已服 ${esc(e.medName)} ${esc(e.dose)}`:'未服药'):`<b>${e.sys}/${e.dia}</b>${e.hr?` · HR ${e.hr}`:''}${e.weight?` · ${e.weight} lb`:''}`;return `<div class="entry"><b>${e.date} ${e.time} · ${name}</b><br>${main}<br>${e.symptom&&e.type!=='medicine'?`<span class="pill">${esc(e.symptom)}</span>`:''}${e.note?`<span class="pill">${esc(e.note)}</span>`:''}</div>`}).join(''):'暂无记录';let cutoff=new Date();cutoff.setDate(cutoff.getDate()-6);let cs=cutoff.toISOString().slice(0,10),r=d.filter(x=>x.date>=cs),m=r.filter(x=>x.type==='morning'&&x.sys),n=r.filter(x=>x.type==='night'&&x.sys),w=r.filter(x=>x.weight);$('stats').innerHTML=r.length?`早晨平均：<b>${avg(m,'sys')}/${avg(m,'dia')}</b> mmHg　HR ${avg(m,'hr')}<br>睡前平均：<b>${avg(n,'sys')}/${avg(n,'dia')}</b> mmHg　HR ${avg(n,'hr')}<br>平均体重：<b>${avg(w,'weight',1)}</b> lb<br><span class="hint">按最近7个日历日计算，共 ${r.length} 条记录。</span>`:'暂无数据';drawCharts()}

function setRange(n){chartRange=n;['r7','r30','rAll'].forEach(id=>$(id).classList.remove('active'));$(n===7?'r7':n===30?'r30':'rAll').classList.add('active');drawCharts()}
function dayKey(d){return d.date}
function chartDays(){let d=data(), keys=[...new Set(d.map(dayKey))].sort();if(chartRange){let end=new Date(localDate()+'T12:00:00'), start=new Date(end);start.setDate(start.getDate()-chartRange+1);let s=start.toISOString().slice(0,10);keys=keys.filter(k=>k>=s)}return keys}
function dailyMap(){let out={};for(let e of data()){out[e.date]??={};if(e.type==='morning'){if(e.weight)out[e.date].weight=e.weight;if(e.sys){out[e.date].ms=e.sys;out[e.date].md=e.dia}}if(e.type==='night'&&e.sys){out[e.date].ns=e.sys;out[e.date].nd=e.dia}if(e.type==='medicine'&&e.medTaken==='yes')out[e.date].med=true}return out}
function moving(keys,map,field){return keys.map((k,i)=>{let vals=[];for(let j=Math.max(0,i-6);j<=i;j++){let v=map[keys[j]]?.[field];if(Number.isFinite(v))vals.push(v)}return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null})}
function setupCanvas(c){let rect=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=Math.max(300,rect.width*dpr);c.height=Math.max(180,rect.height*dpr);let x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);return {x,w:rect.width,h:rect.height}}
function lineChart(id,keys,series,yMin,yMax,meds,target){let c=$(id),{x,w,h}=setupCanvas(c);x.clearRect(0,0,w,h);let pad={l:42,r:12,t:16,b:30},pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;if(!keys.length){x.fillStyle='#667085';x.font='14px -apple-system';x.fillText('暂无数据',pad.l,40);return}let vals=series.flatMap(s=>s.vals.filter(Number.isFinite));if(target!=null)vals.push(target);if(!vals.length)return;let lo=yMin??Math.floor((Math.min(...vals)-5)/5)*5,hi=yMax??Math.ceil((Math.max(...vals)+5)/5)*5;if(hi<=lo)hi=lo+10;let X=i=>pad.l+(keys.length===1?pw/2:i*pw/(keys.length-1)),Y=v=>pad.t+(hi-v)*ph/(hi-lo);x.strokeStyle='#d9e0e6';x.lineWidth=1;x.fillStyle='#667085';x.font='11px -apple-system';for(let j=0;j<=4;j++){let v=lo+(hi-lo)*j/4,y=Y(v);x.beginPath();x.moveTo(pad.l,y);x.lineTo(w-pad.r,y);x.stroke();x.fillText(Math.round(v),4,y+4)}if(target!=null){x.setLineDash([5,4]);x.strokeStyle='#98a2b3';x.beginPath();x.moveTo(pad.l,Y(target));x.lineTo(w-pad.r,Y(target));x.stroke();x.setLineDash([])}series.forEach((s,si)=>{x.strokeStyle=['#355c7d','#9a6700','#7b61a8','#3d7f5f','#111827'][si%5];x.lineWidth=s.avg?2.8:1.6;x.setLineDash(s.avg?[6,4]:[]);x.beginPath();let started=false;s.vals.forEach((v,i)=>{if(!Number.isFinite(v)){started=false;return}let xx=X(i),yy=Y(v);if(!started){x.moveTo(xx,yy);started=true}else x.lineTo(xx,yy)});x.stroke();x.setLineDash([])});meds.forEach((m,i)=>{if(m){x.fillStyle='#7b61a8';x.font='13px -apple-system';x.fillText('💊',X(i)-7,pad.t+13)}});let step=Math.max(1,Math.ceil(keys.length/5));x.fillStyle='#667085';x.font='10px -apple-system';keys.forEach((k,i)=>{if(i%step===0||i===keys.length-1)x.fillText(k.slice(5).replace('-','/'),X(i)-12,h-8)})}
function drawCharts(){let keys=chartDays(),map=dailyMap(),meds=keys.map(k=>!!map[k]?.med),w=keys.map(k=>map[k]?.weight??null),ms=keys.map(k=>map[k]?.ms??null),md=keys.map(k=>map[k]?.md??null),ns=keys.map(k=>map[k]?.ns??null),nd=keys.map(k=>map[k]?.nd??null);lineChart('weightChart',keys,[{vals:w},{vals:moving(keys,map,'weight'),avg:true}],null,null,meds,170);lineChart('bpChart',keys,[{vals:ms},{vals:md},{vals:ns},{vals:nd},{vals:moving(keys,map,'ms'),avg:true}],50,180,meds,null)}
window.addEventListener('resize',()=>drawCharts());

function csvText(){let d=data(),h=['日期','时间','类型','体重lb','是否服药','药名','剂量','收缩压','舒张压','心率','症状','备注'],q=v=>'"'+String(v??'').replaceAll('"','""')+'"';return '\ufeff'+h.join(',')+'\n'+d.map(e=>[e.date,e.time,e.type,e.weight,e.type==='medicine'?(e.medTaken==='yes'?'是':'否'):'',e.medName,e.dose,e.sys,e.dia,e.hr,e.symptom,e.note].map(q).join(',')).join('\n')}
async function shareCSV(){if(!data().length){alert('还没有记录');return}let blob=new Blob([csvText()],{type:'text/csv;charset=utf-8'}),file=new File([blob],'体重血压记录.csv',{type:'text/csv'});try{if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'体重血压记录'});return}}catch(e){if(e.name==='AbortError')return}let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
async function backupJSON(){let blob=new Blob([JSON.stringify(data(),null,2)],{type:'application/json'}),file=new File([blob],'血压记录备份.json',{type:'application/json'});try{if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'血压记录备份'});return}}catch(e){if(e.name==='AbortError')return}let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restoreJSON(){$('restoreFile').click()} $('restoreFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d))throw 0;if(confirm(`恢复 ${d.length} 条记录并替换当前数据？`)){put(d);render()}}catch{alert('备份文件格式不正确。')}e.target.value=''};
function clearAll(){if(confirm('确定清空所有记录吗？请先备份。')){localStorage.removeItem(KEY);render()}}
render();
</script></body></html>
